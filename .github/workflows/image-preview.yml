name: Image preview

# Resolves the Wikimedia Commons images the publisher would use for the next days and
# commits the list (title + licence + credit) to content/state/image_preview.json for review.
on:
  workflow_dispatch:
  push:
    paths: ["content/queue/**"]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Resolve images for the next 8 days
        run: |
          DATES=$(python -c "from datetime import date, timedelta as t; print(' '.join(str(date.today()+t(d)) for d in range(8)))")
          python -m bot.media $DATES
      - name: Commit preview
        run: |
          git config user.name "history-unsealed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/state/image_preview.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: image preview"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
