name: Check setup

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v24.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Facebook token
        run: python -m bot.publish --check
      - name: Cloudflare image generation
        run: |
          python - <<'EOF'
          from pathlib import Path
          from bot import images
          p = images.generate("an ancient stone archway in the desert at sunset", Path("out/check.jpg"))
          print("image ok:", p, p.stat().st_size, "bytes")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: check-image
          path: out/check.jpg
          if-no-files-found: ignore
