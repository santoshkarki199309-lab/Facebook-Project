name: Check setup

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v24.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Facebook token
        run: python -m bot.publish --check
      - name: Wikimedia Commons archive search
        run: |
          python - <<'EOF'
          from bot import media
          hit = media.commons_search("Antikythera mechanism", "image")
          print("image:", hit and hit["title"], hit and hit["license"])
          film = media.commons_search("Wright brothers flight 1903", "video")
          print("film:", film and film["title"], film and film["license"])
          assert hit, "Commons image search failed"
          EOF
