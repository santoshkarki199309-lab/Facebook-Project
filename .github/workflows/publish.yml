name: Publish

on:
  schedule:
    - cron: "47 12 * * *"   # slot b — reel   (US morning / UK afternoon)
    - cron: "52 16 * * *"   # slot a — photo  (US lunch / UK evening)
    - cron: "13 23 * * *"   # slot d — reel   (US prime time)
    - cron: "7 2 * * *"     # slot c — photo  (US late evening / West coast prime time)
    # Backups ~45 min later: GitHub sometimes delays or drops scheduled runs. A backup does
    # nothing if its slot was already published.
    - cron: "33 13 * * *"   # backup b
    - cron: "37 17 * * *"   # backup a
    - cron: "58 23 * * *"   # backup d
    - cron: "53 2 * * *"    # backup c
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to publish (or 'comments' to only add missing sources comments)"
        type: choice
        options: [a, b, c, d, comments]
        required: true
      date:
        description: "UTC date YYYY-MM-DD (blank = today)"
        required: false
      dry_run:
        description: "Render only, do not post"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v24.0' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "47 12 * * *") echo "slot=b" >> "$GITHUB_OUTPUT" ;;
            "52 16 * * *") echo "slot=a" >> "$GITHUB_OUTPUT" ;;
            "13 23 * * *") echo "slot=d" >> "$GITHUB_OUTPUT" ;;
            "7 2 * * *")   echo "slot=c" >> "$GITHUB_OUTPUT" ;;
            "33 13 * * *") echo "slot=b" >> "$GITHUB_OUTPUT" ;;
            "37 17 * * *") echo "slot=a" >> "$GITHUB_OUTPUT" ;;
            "58 23 * * *") echo "slot=d" >> "$GITHUB_OUTPUT" ;;
            "53 2 * * *")  echo "slot=c" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt

      - name: Publish
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$FB_PAGE_TOKEN" ]; then
            echo "::notice::FB_PAGE_TOKEN secret not set yet — skipping scheduled publish. See SETUP.md."
            exit 0
          fi
          if [ "${{ steps.slot.outputs.slot }}" = "comments" ]; then
            python -m bot.publish --backfill-comments
            exit 0
          fi
          ARGS="--slot ${{ steps.slot.outputs.slot }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --scheduled"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m bot.publish $ARGS

      - name: Save rendered media (7 days)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit publish state
        if: success()
        run: |
          git config user.name "history-unsealed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: published slot ${{ steps.slot.outputs.slot }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
