name: Publish

on:
  schedule:
    # 6 posts a day (UTC). Each slot has a backup ~45 min later because GitHub sometimes
    # delays or drops scheduled runs; a backup does nothing if the slot was already published.
    - cron: "57 3 * * *"    # c photo   07:57 UAE
    - cron: "53 8 * * *"    # b reel    12:53 UAE
    - cron: "47 12 * * *"   # e photo   16:47 UAE
    - cron: "22 15 * * *"   # a photo   19:22 UAE
    - cron: "37 21 * * *"   # f long video
    - cron: "13 23 * * *"   # d reel
    - cron: "43 4 * * *"    # backup c
    - cron: "38 9 * * *"    # backup b
    - cron: "33 13 * * *"   # backup e
    - cron: "7 16 * * *"    # backup a
    - cron: "23 22 * * *"   # backup f
    - cron: "58 23 * * *"   # backup d
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to publish (or 'comments' to only add missing sources comments)"
        type: choice
        options: [a, b, c, d, e, f, comments]
        required: true
      date:
        description: "UTC date YYYY-MM-DD (blank = today)"
        required: false
      dry_run:
        description: "Render only, do not post"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v24.0' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "57 3 * * *"|"43 4 * * *")    echo "slot=c" >> "$GITHUB_OUTPUT" ;;
            "53 8 * * *"|"38 9 * * *")    echo "slot=b" >> "$GITHUB_OUTPUT" ;;
            "47 12 * * *"|"33 13 * * *")  echo "slot=e" >> "$GITHUB_OUTPUT" ;;
            "22 15 * * *"|"7 16 * * *")   echo "slot=a" >> "$GITHUB_OUTPUT" ;;
            "37 21 * * *"|"23 22 * * *")  echo "slot=f" >> "$GITHUB_OUTPUT" ;;
            "13 23 * * *"|"58 23 * * *")  echo "slot=d" >> "$GITHUB_OUTPUT" ;;
            *)                            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt

      - name: Publish
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$FB_PAGE_TOKEN" ]; then
            echo "::notice::FB_PAGE_TOKEN secret not set yet — skipping scheduled publish. See SETUP.md."
            exit 0
          fi
          if [ "${{ steps.slot.outputs.slot }}" = "comments" ]; then
            python -m bot.publish --backfill-comments
            exit 0
          fi
          ARGS="--slot ${{ steps.slot.outputs.slot }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --scheduled"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m bot.publish $ARGS

      - name: Save rendered media (7 days)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit publish state
        if: success()
        run: |
          git config user.name "history-unsealed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: published slot ${{ steps.slot.outputs.slot }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q || git rebase --abort 2>/dev/null
            git push -q && exit 0
            sleep 10
          done
          exit 1
