name: Insights

on:
  schedule:
    - cron: "37 4 * * 1"   # Mondays, before the content task runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v24.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: |
          if [ -z "$FB_PAGE_TOKEN" ]; then echo "::notice::FB_PAGE_TOKEN not set — skipping."; exit 0; fi
          python -m bot.insights
      - name: Commit insights
        run: |
          git config user.name "history-unsealed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/state/insights.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "insights: weekly snapshot"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q || git rebase --abort 2>/dev/null
            git push -q && exit 0
            sleep 10
          done
          exit 1
